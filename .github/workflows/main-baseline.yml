# main-baseline.yml
#
# Minimal "every commit on main is healthy" gate for InstaeditLogin.
#
# Scope: build + vet + test + gofmt-lint + non-blocking LOC report.
# Runs on every push to main so the HEAD commit carries a required
# status check that flips green the moment the canonical main passes.
#
# LOC reporting: the BLOCKING diff-based size-regression gate (`make
# loc-check`, threshold 800) deliberately lives in integration-fast.yml
# (item 12 of its header). This workflow adds its NON-BLOCKING
# companion: `scripts/loc-report.sh -t 800` prints the current full-tree
# LOC backlog report on every run and always exits 0, so the refactoring
# backlog stays tracked automatically without ever reddening the gate.
#
# This workflow INTENTIONALLY complements (not replaces) the heavier
# ones already in .github/workflows/:
#   - integration-fast.yml: race tests, testcontainers, OAuth canary,
#     frontend vitest + oxlint + tsc, integration tests; deploy-gating.
#   - integration-slow.yml: long-running end-to-end suite; scheduled.
#   - oauth-canary.yml: weekly Google OAuth tokeninfo probe.
#   - deploy.yml / deploy-preview.yml: Vercel deployment handoff.
#
# Keeping the gate narrow (build / vet / test / lint) makes it a
# fast, deterministic blocker on the commit → push → CI feedback
# loop. Heavy lane failures surface via integration-fast.yml +
# integration-slow.yml without consuming the main-baseline green.
#
# Conventions:
#   - actions/setup-go@v5 + go-version-file: go.mod (mirrors
#     integration-fast.yml so the toolchain matches the legacy lane).
#   - gofmt -l . (same as integration-fast.yml; no auto-write).
#   - exclude pkg/api from the test target via go list filter, mirroring
#     the operator smoke matrix that skipped untracked pkg/api drafts
#     in earlier commits (those files are not committed to main).
name: main-baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# One concurrent run per ref; cancel in-flight runs on a new push so
# the latest commit always wins.
concurrency:
  group: main-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vet-test-lint:
    name: build / vet / test / lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so any future step that needs full history
          # (e.g. git-based version stamping) can read without rework.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check (no auto-write)
        # Same hard-fail-on-drift rule as integration-fast.yml. The
        # Makefile's `lint-check` target wraps this for local devs.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet ./...
        run: go vet ./...

      - name: go build ./...
        # Build the whole module; pkg/api untracked drafts in the
        # operator working tree are not present on main so the
        # canonical code path compiles cleanly.
        run: go build ./...

      - name: LOC backlog report (non-blocking, threshold 800)
        # Informational only: prints the current source-file length
        # report (top-N largest + every tracked go/ts/tsx file above
        # 800 lines) so the refactoring backlog stays visible on every
        # main run. loc-report.sh ALWAYS exits 0 — this step can never
        # block the gate. The BLOCKING diff-based regression gate
        # (`make loc-check`) remains in integration-fast.yml; this is
        # its non-blocking companion that keeps the report tracked.
        run: scripts/loc-report.sh -t 800

      - name: go test ./...
        # Full ./... test target — NO package filter. The historical
        # pkg/api exclusion was added to skip "uncommitted drafts" but
        # pkg/api IS committed on main with substantial test code
        # (contracts, account routes, velox validation, e2e harnesses).
        # Excluding it silently bypasses the main-baseline gate that
        # the operator-facing "every commit on main gets green status
        # check" contract depends on. CI now catches pkg/api
        # regressions that the operator smoke lane (dev-only) cannot.
        run: go test -count=1 -timeout 5m ./...
