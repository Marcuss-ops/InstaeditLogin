# .github/workflows/integration-fast.yml — InstaEditLogin CI FAST gate
#
# This file is the PRODUCTION-DEPLOY-GATING workflow. deploy.yml's
# workflow_run gate is `workflows: [integration-fast]` — this file's
# `success` conclusion is the only signal that triggers a production
# deploy. integration-slow.yml runs in parallel and alert-onlys on
# failure (auto-GH-issue with label `flaky-or-broken/e2e`). The split
# rationale is in TOMORROW.md: shared ubuntu-runner + testcontainers
# Postgres infra was structurally flakey and was masking product-code
# regressions with infra noise — strict-gating the bundle was
# disproportionate. The slow lane preserves the coverage; the fast
# lane preserves the gate.
#
# Coverage (this file):
#   1. Go files are gofmt-clean (Blocco #3.1 hard requirement).
#   2. `go vet ./...` produces no output.
#   3. `go test -race -count=1 -timeout 120s ./...` passes with
#      the race detector (full unit suite).
#   4. `go build ./...` builds the project end-to-end.
#   5. Frontend `npm ci` succeeds with the committed lockfile.
#   6. Frontend `npm run lint` (oxlint) is clean.
#   7. Frontend `npm run test` (vitest) is clean.
#   8. Frontend `npm run build` (tsc + vite build) produces a bundle.
#   9. OAuth scope canary *unit* tests pass (the LIVE tokeninfo leg
#      stays in oauth-canary.yml because it requires a fork-PR-
#      inaccessible repo secret).
#  10. Integration tests against an ephemeral Postgres via
#      testcontainers-go pass (`make test-integration`). Covers
#      TestMigrations_OrderIndependent without a bash migrate step.
#  11. Envfile parser regression test (Python, fast).
#  12. Source-file size regression gate (`make loc-check`): fails when a
#      tracked go/ts/tsx file GROWS past 800 lines vs. origin/main.
#      Diff-based: pre-existing large files don't block; new growth does.
#
# NOT in this file (lives in integration-slow.yml):
#   - `make test-e2e` — full E2E suite with testcontainers-go
#     Postgres + httptest fakes for Drive/YouTube/Velox. The slow
#     gate runs asynchronously and alerts via auto-GH-issue on
#     failure rather than blocking deploys. The split rationale
#     is documented in TOMORROW.md + the user's policy decision
#     on the e2e-onion-peel pattern (shared ubuntu-runner +
#     testcontainers infra was structurally flakey, masking
#     product-code regressions with infra noise).

name: integration-fast

# Least-privilege: checkout + build + test don't need deploy scopes,
# but step 8.5 uploads `web/dist` as the `web-dist` artifact that
# deploy.yml consumes (`vercel deploy --prebuilt`) — and
# actions/upload-artifact@v4 requires `actions: write` on the token.
# Deploy credentials (VERCEL_*) stay exclusively in deploy.yml.
permissions:
  contents: read
  actions: write

# NOTE: GitHub Actions YAML 1.2 treats `on` as a normal string, but
# some YAML tools (yaml.safe_load in Python ≤1.1 mode, older SDK
# parsers) interpret `on` as boolean true. Quoting the key makes the
# file portable across both parsers — matches the sibling conventions in integration-fast.yml + integration-slow.yml (legacy integration.yml retired at this commit)
# existing convention.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Docker is pre-installed on ubuntu-runners (testcontainers-go relies
# on it for the Postgres + Redis integration tests in step 10).
# Runner's default Docker has full socket access in CI; locally the
# README documents the requirement.

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Cancel in-progress runs in the same group so a fast follow-up
    # push doesn't spawn duplicate runners re-pulling postgres:17-alpine
    # + node modules + Go module cache. Group by workflow + PR number
    # (PR events) OR ref (push events): `github.event.pull_request.number`
    # is 0 outside PR contexts so we OR with github.ref.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      # ─── 1. Checkout ──────────────────────────────────────────────
      # fetch-depth: 0 so `make loc-check` can resolve origin/main as
      # the diff base for the size-regression gate (a shallow checkout
      # would not have the base ref available).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── 2. Validate GitHub Actions workflow YAML syntax ────────
      # Loads every workflow file with PyYAML so a malformed YAML
      # check-in fails the build before any expensive job runs.
      - name: Validate workflow YAML syntax
        run: |
          python3 -c 'import yaml'
          python3 - <<'PY'
          import glob
          import subprocess
          import sys
          import os

          try:
              import yaml
          except ImportError:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet", "pyyaml==6.0.1"]
              )
              import yaml

          workflows_dir = os.path.join(".github", "workflows")
          files = sorted(
              glob.glob(os.path.join(workflows_dir, "*.yml")) +
              glob.glob(os.path.join(workflows_dir, "*.yaml"))
          )

          if not files:
              print("No workflow YAML files found")
              sys.exit(0)

          failed = False
          for path in files:
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      yaml.safe_load(f)
                  print(f"✓ {path}")
              except yaml.YAMLError as e:
                  print(f"✗ YAML syntax error in {path}: {e}", file=sys.stderr)
                  failed = True
              except OSError as e:
                  print(f" Failed to read {path}: {e}", file=sys.stderr)
                  failed = True

          sys.exit(1 if failed else 0)
          PY

      # ─── 3. Go toolchain ──────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Drive the Go version from go.mod so a future bump
          # propagates here automatically.
          go-version-file: go.mod
          cache: true

      # ─── 4. Go formatting check (Blocco #3.1 hard requirement) ────
      # Use `gofmt -l .` to LIST files that would be reformatted
      # (empty == clean). Output piped to `cat` so the actual
      # offending filenames show up in the CI log when this fails.
      # NO `-w` — CI must FAIL not silently rewrite the working tree.
      - name: Check Go formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::unformatted files detected (run 'gofmt -w .' locally then re-push):"
            echo "$UNFORMATTED"
            echo
            echo "── gofmt -d (preview of changes) ──"
            gofmt -d . | head -200
            exit 1
          fi
          echo "✓ gofmt clean"

      # ─── 4. Go vet ────────────────────────────────────────────────
      - name: Run go vet
        run: go vet ./...

      # ─── 4.5. Entrypoint topology regression check ───────────────
      # Confirms production uses api + worker + migrate only while the
      # deprecated single-process wrapper remains explicit for local recovery.
      - name: Verify entrypoint topology
        run: make verify-entrypoint-topology

      # ─── 4.6. Source-file size regression gate ────────────────────
      # `make loc-check` fails when a tracked go/ts/tsx file GROWS past
      # 800 lines relative to origin/main. Diff-based: files already over
      # the threshold are reported but do not block, so the existing
      # backlog (see scripts/loc-report.sh) doesn't break CI while any
      # NEW size regression hard-fails. Local: `make loc-check`;
      # strict full-tree: `make loc-check LOC_AGAINST=none`.
      - name: Check source-file size regressions (loc-check)
        run: make loc-check

      # ─── 5. Go test -race (full unit suite) ───────────────────────
      # Equivalent to `make backend-test`. Runs WITHOUT the integration
      # build tag so a Docker absence on the runner does NOT block
      # this step. (Integration-tagged tests live below as their own
      # step that DOES require Docker.)
      - name: Run Go tests with race detector
        # No `|| true`: race-detector hits MUST hard-fail the job
        # (the "workflow fails = deploy doesn't happen" contract).
        #
        # Integration-tagged suites in internal/database,
        # internal/worker and internal/testutil/redis are guarded by
        # `//go:build integration` at the top of those files; without
        # the `-tags=integration` flag they compile to empty test
        # binaries and pass vacuously, so no explicit package-list
        # filter is needed here.
        run: go test -race -count=1 -timeout 120s ./...

      # ─── 6. Go build (sanity — works without -tags) ──────────────
      - name: Verify Go build
        run: go build ./...

      # ─── 7. Node toolchain ────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pin to web/package.json's declared engines.node (when
          # present) else fall back to the current LTS 20. The lockfile
          # is what `npm ci` actually keys off of; the version here
          # just sets up cache + binary.
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ─── 8. Frontend CI block ─────────────────────────────────────
      # `npm ci` (NOT `npm install`) — uses the committed lockfile,
      # fails fast if the lockfile is stale. pretest/prebuild hooks
      # (scripts/generate-favicon-ico.mjs) run automatically as part
      # of those commands. oxlint (`npm run lint`) is faster than
      # tsc + eslint combined, so the lint step is cheap.
      - name: Frontend checks (lint + test + build)
        working-directory: ./web
        run: |
          echo "── npm ci ──"
          npm ci
          echo
          echo "── npm run lint ──"
          npm run lint
          echo
          echo "── npm run test ──"
          npm run test
          echo
          echo "── npm run build ──"
          npm run build
          echo
          echo "✓ frontend gateway passed"


      # ─── 8.5. Upload frontend bundle (consumed by deploy.yml) ────
      # deploy.yml runs `vercel deploy --prebuilt`, which uploads the
      # bundle built HERE — so the deploy job never re-runs npm ci or
      # tsc/vite build (saves ~1-2 min per deploy). The artifact name
      # must stay in sync with deploy.yml's download step.
      - name: Upload frontend bundle (web-dist)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

      # ─── 8.6. OAuth scope canary unit tests (PR-lane only) ────────
      # The canary binary's *pure-function* test suite runs here so
      # structural drift (docs/OAUTH-PRODUCTION.md missing a canonical
      # scope, fly secrets lists incoherent, provider-triple missing)
      # fails PRs immediately. The LIVE tokeninfo leg is deferred to
      # the separate .github/workflows/oauth-canary.yml workflow
      # because it requires a repository secret (DRIVE_OAUTH_CANARY_TOKEN)
      # that forked PRs cannot bring.
      - name: OAuth scope canary + secrets coherence smoke
        run: go test -count=1 ./cmd/oauth-scope-canary/...

      # ─── 9. Integration tests (Postgres via testcontainers-go) ────
      # Delegates to the Makefile — single source of truth for the
      # test command. Edit `make test-integration`, not this step.
      #
      # Includes internally:
      #   - TestMigrations_OrderIndependent (postgresql 17-alpine +
      #     twice-apply fingerprint diff) — covers the user's "apply
      #     migrations on empty DB + apply again (idempotency)" rule
      #     WITHOUT a bash migrate step that would hit bootstrap.Wire's
      #     fail-fast S3 / JWT_SECRET / ENCRYPTION_KEYS validation.
      #   - PublishWorker + ReconcileWorker pipeline (uses real PG +
      #     real httptest.Server for the TikTok wire).
      #   - internal/testutil/redis PING/SET/GET roundtrip (validates
      #     the runtime abstraction works for non-SQL backends).
      - name: Run integration tests (database + worker + redis smoke)
        run: make test-integration

      # ─── 10. Dump test summary on failure ─────────────────────────
      - name: Dump test summary on failure
        if: failure()
        run: |
          echo "=== Likely causes ==="
          echo "  - gofmt file list detected (rerun 'gofmt -w .' locally then re-push)"
          echo "  - go vet flagged a suspicious construct (e.g. printf %s on user input)"
          echo "  - go test -race hit a data race (look at the failing test's stack)"
          echo "  - npm ci failure: lockfile out of sync → re-run 'npm install' locally, commit web/package-lock.json"
          echo "  - npm run lint failure (oxlint): fix in web/, re-push"
          echo "  - npm run test failure (vitest): fix the failing test"
          echo "  - npm run build failure (tsc + vite): check the bundle error + type errors"
          echo "  - Docker not available on runner (impossible on ubuntu-latest)"
          echo "  - Migration added a column Go model expects (must add to requiredColumns in internal/database/migrations_integration_test.go)"
          echo "  - Migration lost idempotency (a non-IF NOT EXISTS ALTER on re-run)"
          echo "  - Worker integration test hung — check the per-leaf 15s parallel-drain ceiling"
          echo "  - loc-check: a tracked file grew past 800 lines vs origin/main — refactor or revert"
          echo
          echo "Run locally:"
          echo "  make lint-check"
          echo "  make loc-check"
          echo "  make test-integration"
          echo "  cd web && npm ci && npm run lint && npm run test && npm run build"

  # ─── envfile parser regression test (formerly integrated in legacy integration.yml step 8.5; that workflow was retired at the CI-split commit and the test was lifted into this file) ───
  # The archived Fly .env parser in scripts/_parse_envfile.py remains
  # a historical regression fixture only; it is not a deploy/runtime
  # path. The `python3 scripts/test_parse_envfile.py` Makefile target
  # was retired alongside the Fly cutover, so CI runs the compatibility
  # regression directly.
  # Fast (<1s) pure-python — no Docker / no external services needed.
  # Mirrors the `integration.yml::test-parse-envfile` shape (legacy file retired at the CI-split commit; the test now lives in this file).
  test-parse-envfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    concurrency:
      group: test-parse-envfile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The test_parse_envfile.py script is a pure-Python regression
      # test for the archived Fly contract and _parse_envfile.py. Exit
      # 0 on all-pass, non-zero on first failure.
      - name: Run envfile parser regression test
        run: python3 scripts/test_parse_envfile.py
