# .github/workflows/integration-fast.yml — InstaEditLogin CI FAST gate
#
# This file is the PRODUCTION-DEPLOY-GATING workflow. deploy.yml's
# workflow_run gate is `workflows: [integration-fast]` — this file's
# `success` conclusion is the only signal that triggers a production
# deploy. integration-slow.yml runs in parallel and alert-onlys on
# failure (auto-GH-issue with label `flaky-or-broken/e2e`). The split
# rationale is in TOMORROW.md: shared ubuntu-runner + testcontainers
# Postgres infra was structurally flakey and was masking product-code
# regressions with infra noise — strict-gating the bundle was
# disproportionate. The slow lane preserves the coverage; the fast
# lane preserves the gate.
#
# PARALLEL-JOB TOPOLOGY (this revision):
# The old single `ci` job ran everything sequentially (~5 min wall):
#   gofmt/vet(21s) → go test -race ./...(116s) → go build → frontend
#   (64s) → integration testcontainers (94s).
# It is now split into FIVE parallel jobs so wall time is bounded by
# the SLOWEST lane (~90-100s) instead of the SUM:
#   - go-static   : gofmt / vet / entrypoint / loc-check / build /
#                   oauth-canary (fast checks, no long test runs)
#   - go-test     : `go test -race` sharded 3-way via a matrix
#                   (shard-a: pkg/cmd/tests/scripts; shard-b: the
#                   thumbnailrender monolith ~45s alone; shard-c: the
#                   rest of internal). 49/49 packages covered — see
#                   the shard commands' comments.
#   - frontend    : npm ci + lint + vitest + vite build + uploads the
#                   web-dist artifact consumed by deploy.yml.
#   - integration : testcontainers suite split into FOUR lanes: the db
#                   lane (was the ~111s bottleneck — 37 container
#                   spin-ups!) is sharded 3-way (db-a tenancy/schema,
#                   db-b meta+oauth migrations, db-c the -skip
#                   complement) + worker/redis. Wall ~50-90s per lane.
#   - test-parse-envfile: fast pure-Python regression (unchanged).
# The deploy gate still requires the WHOLE workflow to conclude
# `success` — parallel lanes don't weaken the contract.
#
# REBALANCE NOTE: lane db-c is the `-skip` complement of db-a+db-b,
# so ANY new database test lands there by design — it will grow
# monotonically and eventually re-become the critical path. When that
# happens, move its heaviest tests into a new explicit `-run` lane
# (mirroring the pattern in the two sibling lanes).
#
# Coverage (this file):
#   1. Go files are gofmt-clean (Blocco #3.1 hard requirement).
#   2. `go vet ./...` produces no output.
#   3. `go test -race -count=1 -timeout 120s` passes with the race
#      detector (full unit suite, sharded across 3 parallel jobs).
#   4. `go build ./...` builds the project end-to-end.
#   5. Frontend `npm ci` succeeds with the committed lockfile.
#   6. Frontend `npm run lint` (oxlint) is clean.
#   7. Frontend `npm run test` (vitest) is clean.
#   8. Frontend `npm run build` (tsc + vite build) produces a bundle.
#   9. OAuth scope canary *unit* tests pass (the LIVE tokeninfo leg
#      stays in oauth-canary.yml because it requires a fork-PR-
#      inaccessible repo secret).
#  10. Integration tests against an ephemeral Postgres via
#      testcontainers-go pass (database lane: migrations /
#      TestMigrations_OrderIndependent; worker+redis lane:
#      PublishWorker + ReconcileWorker pipeline + redis smoke).
#  11. Envfile parser regression test (Python, fast).
#  12. Source-file size regression gate (`make loc-check`): fails when a
#      tracked go/ts/tsx file GROWS past 800 lines vs. origin/main.
#      Diff-based: pre-existing large files don't block; new growth does.
#
# NOT in this file (lives in integration-slow.yml):
#   - `make test-e2e` — full E2E suite with testcontainers-go
#     Postgres + httptest fakes for Drive/YouTube/Velox. The slow
#     gate runs asynchronously and alerts via auto-GH-issue on
#     failure rather than blocking deploys. The split rationale
#     is documented in TOMORROW.md + the user's policy decision
#     on the e2e-onion-peel pattern (shared ubuntu-runner +
#     testcontainers infra was structurally flakey, masking
#     product-code regressions with infra noise).

name: integration-fast

# Least-privilege: checkout + build + test don't need deploy scopes,
# but the frontend job uploads `web/dist` as the `web-dist` artifact
# that deploy.yml consumes (`vercel deploy --prebuilt`) — and
# actions/upload-artifact@v4 requires `actions: write` on the token.
# Deploy credentials (VERCEL_*) stay exclusively in deploy.yml.
permissions:
  contents: read
  actions: write

# NOTE: GitHub Actions YAML 1.2 treats `on` as a normal string, but
# some YAML tools (yaml.safe_load in Python ≤1.1 mode, older parsers)
# interpret `on` as boolean true. Quoting the key makes the file
# portable across both parsers — matches the sibling conventions in
# integration-slow.yml (legacy integration.yml retired at this commit).
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Docker is pre-installed on ubuntu-runners (testcontainers-go relies
# on it for the Postgres + Redis integration tests). Runner's default
# Docker has full socket access in CI; locally the README documents
# the requirement.

# Cancel in-progress runs in the same group so a fast follow-up push
# doesn't spawn duplicate runners re-pulling postgres:17-alpine + node
# modules + Go module cache. Group by workflow + PR number (PR events)
# OR ref (push events): `github.event.pull_request.number` is 0 outside
# PR contexts so we OR with github.ref. NOTE: every parallel job shares
# this same group so ONE new push cancels ALL in-flight lanes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # go-static — fast checks that don't run the long race suite.
  # Wall ~35-45s. (Vet takes ~21s; build ~4s; the rest is <1s.)
  # ──────────────────────────────────────────────────────────────
  go-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # fetch-depth: 0 so `make loc-check` can resolve origin/main as
      # the diff base for the size-regression gate (a shallow checkout
      # would not have the base ref available).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Validates every workflow file with PyYAML so a malformed YAML
      # check-in fails the build before any expensive job runs.
      - name: Validate workflow YAML syntax
        run: |
          python3 -c 'import yaml'
          python3 - <<'PY'
          import glob
          import subprocess
          import sys
          import os

          try:
              import yaml
          except ImportError:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", "--quiet", "pyyaml==6.0.1"]
              )
              import yaml

          workflows_dir = os.path.join(".github", "workflows")
          files = sorted(
              glob.glob(os.path.join(workflows_dir, "*.yml")) +
              glob.glob(os.path.join(workflows_dir, "*.yaml"))
          )

          if not files:
              print("No workflow YAML files found")
              sys.exit(0)

          failed = False
          for path in files:
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      yaml.safe_load(f)
                  print(f"✓ {path}")
              except yaml.YAMLError as e:
                  print(f"✗ YAML syntax error in {path}: {e}", file=sys.stderr)
                  failed = True
              except OSError as e:
                  print(f" Failed to read {path}: {e}", file=sys.stderr)
                  failed = True

          sys.exit(1 if failed else 0)
          PY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::unformatted files detected (run 'gofmt -w .' locally then re-push):"
            echo "$UNFORMATTED"
            echo
            echo "── gofmt -d (preview of changes) ──"
            gofmt -d . | head -200
            exit 1
          fi
          echo "✓ gofmt clean"

      - name: Run go vet
        run: go vet ./...

      - name: Verify entrypoint topology
        run: make verify-entrypoint-topology

      - name: Check source-file size regressions (loc-check)
        run: make loc-check

      - name: Verify Go build
        run: go build ./...

      - name: OAuth scope canary + secrets coherence smoke
        run: go test -count=1 ./cmd/oauth-scope-canary/...

      - name: Dump test summary on failure
        if: failure()
        run: |
          echo "=== Likely causes ==="
          echo "  - gofmt file list detected (rerun 'gofmt -w .' locally then re-push)"
          echo "  - go vet flagged a suspicious construct (e.g. printf %s on user input)"
          echo "  - npm ci failure: lockfile out of sync → re-run 'npm install' locally, commit web/package-lock.json"
          echo "  - npm run lint failure (oxlint): fix in web/, re-push"
          echo "  - npm run test failure (vitest): fix the failing test"
          echo "  - npm run build failure (tsc + vite): check the bundle error + type errors"
          echo "  - loc-check: a tracked file grew past 800 lines vs origin/main — refactor or revert"

  # ──────────────────────────────────────────────────────────────
  # go-test — `go test -race` sharded across 3 parallel runners.
  # Rationale: a single 116s race run was the CI bottleneck.
  #   shard-a: pkg + cmd + tests + scripts          (~25s local)
  #   shard-b: internal/thumbnailrender — ~45s ALONE (monolith)
  #   shard-c: the rest of internal                 (~18s local)
  # Union of the three shards = `go list ./...` exactly (49/49),
  # verified at authoring time via comm(1). fail-fast: false so one
  # shard's failure doesn't cancel the other lanes mid-run.
  # ──────────────────────────────────────────────────────────────
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests with race detector (shard ${{ matrix.shard }})
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in
            a)
              # pkg/api + cmd + tests/e2e build-tag stubs + scripts helpers
              go test -race -count=1 -timeout 120s \
                ./pkg/... ./cmd/... ./tests/... ./scripts/...
              ;;
            b)
              # thumbnailrender is the single slowest package (~45s local);
              # giving it its own runner keeps it off the critical path.
              go test -race -count=1 -timeout 120s ./internal/thumbnailrender/...
              ;;
            c)
              # every internal package EXCEPT thumbnailrender (shard-b owns it).
              # go list + grep keeps this stable as packages are added/removed.
              PKGS="$(go list ./internal/... | grep -v '/internal/thumbnailrender')"
              go test -race -count=1 -timeout 120s $PKGS
              ;;
          esac

  # ──────────────────────────────────────────────────────────────
  # frontend — lint + vitest + vite build, then upload the bundle.
  # The `web-dist` artifact is consumed by deploy.yml via
  # `vercel deploy --prebuilt` (no re-build in the deploy job).
  # ──────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` (NOT `npm install`) — uses the committed lockfile,
      # fails fast if the lockfile is stale. pretest/prebuild hooks
      # (scripts/generate-favicon-ico.mjs) run automatically as part
      # of those commands. oxlint (`npm run lint`) is faster than
      # tsc + eslint combined, so the lint step is cheap.
      - name: Frontend checks (lint + test + build)
        working-directory: ./web
        run: |
          echo "── npm ci ──"
          npm ci
          echo
          echo "── npm run lint ──"
          npm run lint
          echo
          echo "── npm run test ──"
          npm run test
          echo
          echo "── npm run build ──"
          npm run build
          echo
          echo "✓ frontend gateway passed"

      # deploy.yml runs `vercel deploy --prebuilt`, which uploads the
      # bundle built HERE — so the deploy job never re-runs npm ci or
      # tsc/vite build (saves ~1-2 min per deploy). The artifact name
      # must stay in sync with deploy.yml's download step.
      - name: Upload frontend bundle (web-dist)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────
  # integration — testcontainers suite split into FOUR parallel lanes
  # so no lane pays another's container spin-up + migration runs.
  # The db lane was the CI bottleneck at ~111s (37 container spin-ups
  # in ./internal/database!); it is now sharded 3-way:
  #   db-a    : multi-tenancy + upload-jobs + schema health (~34s
  #             local, ~10 containers)
  #   db-b    : Meta→Instagram + OAuth backfill migrations (~26s)
  #   db-c    : everything else, via `-skip` of A+B patterns (~40s).
  #             Being the -skip lane, any NEW database test lands
  #             here automatically — union of lanes = full suite.
  #   worker  : internal/worker (Publish+Reconcile pipeline on real
  #             Postgres + httptest TikTok wire) + redis smoke.
  # `-count=1` defeats go's test cache so the ephemeral containers
  # actually exercise the code on every run (matches the previous
  # semantics of the single Makefile target; `-v` was dropped — it
  # only added log I/O, not coverage).
  # ──────────────────────────────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [db-a, db-b, db-c, worker]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests (${{ matrix.lane }} lane)
        run: |
          case "${{ matrix.lane }}" in
            db-a)
              make test-integration-db-a
              ;;
            db-b)
              make test-integration-db-b
              ;;
            db-c)
              make test-integration-db-c
              ;;
            worker)
              make test-integration-worker
              ;;
          esac

      # Integration was historically the flaky lane — keep the operator
      # hints close to the failure instead of burying them in go-static.
      - name: Dump integration failure summary
        if: failure()
        run: |
          echo "=== Integration lane likely causes (${{ matrix.lane }}) ==="
          echo "  - Docker not available on runner (impossible on ubuntu-latest)"
          echo "  - Migration added a column Go model expects (must add to requiredColumns in internal/database/migrations_integration_test.go)"
          echo "  - Migration lost idempotency (a non-IF NOT EXISTS ALTER on re-run)"
          echo "  - Worker integration test hung — check the per-leaf 15s parallel-drain ceiling"
          echo "  - Testcontainer image pull flake (postgres:17-alpine / redis:7-alpine) — re-run"

