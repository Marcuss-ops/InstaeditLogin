# .github/workflows/integration-slow.yml — InstaEditLogin CI SLOW gate
#
# Async E2E suite that runs in parallel with the deploy gate but does
# NOT gate production. Runs `make test-e2e` against an ephemeral
# Postgres via testcontainers-go + httptest fakes for Drive / YouTube
# / Velox. The deploy gate is on `integration-fast`; this workflow's
# job is to detect product regressions in the e2e scenarios + surface
# them as actionable GitHub issues via the on:failure() github-script
# step below.
#
# Operational rationale (full policy decision in TOMORROW.md + the
# user's split-policy message):
#
#   - Shared ubuntu-runners + testcontainers-go Postgres has structural
#     flakiness (TCP-listener-vs-log-based-ready race, postgres init
#     variabilities on cold-start, single runner per process slot). The
#     slow lane's noise-to-signal ratio was high enough that several
#     consecutive pushes hit "infra flake blocks the bundle" patterns.
#   - Splitting the gate answers the asymmetric blast-radius question
#     correctly: production deployment should be blocked by CORRECTNESS
#     failures (lint/test/build/compile/format) — which live in
#     integration-fast — not by INFRA failures that flaked during the
#     e2e span. Infra flakes ALERT via auto-issue + status check on the
#     PR UI; they don't hold the bundle.
#   - Triage can happen on operator schedule rather than at deploy
#     urgency: a flaky manifest in this lane gets retried on the next
#     push, while a real regression opens an issue with category label
#     so the next operator morning starts with a sorted by-cause queue.
#
# Why not Slack-webhook-paged?
#   The repo does not yet have a SLACK_WEBHOOK_URL secret. Operator
#   provisioned one is reserved for a follow-up if the issue-creation
#   rate justifies it; until then, GH issues + PR status checks
#   surface the alert path.
#
# Schedule trigger:
#   - weekly Monday 08:00 UTC. Drift detection on testcontainers-go
#     version bumps / GHA runner-side Docker drift lands in the
#     operator's inbox BEFORE the deploy-time spike. If the schedule
#     run is green, products are green; if it fails, an auto-issue
#     opens with the infra-flake-or-broken label.

name: integration-slow

# Contents: read    → checkout repo + read scripts/test_parse_envfile.py
# Issues: write    → on:failure() github-script step auto-creates
#                    an issue; needs the explicit scope because the
#                    default GITHUB_TOKEN has read-only issue scope.
permissions:
  contents: read
  issues: write

# YAML-portability: quote the `on:` key so older yaml.safe_load parsers
# don't barf (matches integration-fast.yml + integration.yml).
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catch-up sweep: even if a push landed at an awkward time with a
  # cancelled e2e run (concurrency cancel-in-progress), the
  # weekly schedule re-runs the suite so silent infra drift surfaces
  # in the operator's inbox BEFORE the next deploy spike.
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  # ─── Task 9/10: E2E pipeline suite (Drive → Velox → S3 → callback)
  # Same shape as the legacy integration.yml::e2e job. The split moves
  # this out of the deploy-gating chain into an alert-only lane.
  #
  # Docker is pre-installed on ubuntu-latest and has full socket access
  # for testcontainers-go. The build tag `e2e` keeps `go test ./...`
  # clean (tests/e2e/*.go is gated).
  e2e:
    runs-on: ubuntu-latest
    # 15 minutes — enough wall-clock for testcontainers-go Postgres
    # init + httptest fakes + the 11 scenarios under TestPipelineE2E
    # plus the OAuth-bind negative/happy paths. Floor + ceiling
    # both match the legacy lane; do not lower without revisiting
    # the per-scenario boot time budget.
    timeout-minutes: 15

    concurrency:
      # Same group key as legacy integration.yml::e2e so a legacy run
      # started before this split AND a fast run after the split
      # share the same cancel-in-progress queue — no duplicate
      # Postgres + httptest-fixture spin-ups.
      group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Delegates to the Makefile — single source of truth. Edit
      # `make test-e2e`, not this step.
      - name: Run E2E pipeline suite (Docker required)
        run: make test-e2e

      # ─── Alerting: auto-open a GitHub issue on failure ──────────
      # No SLACK_WEBHOOK_URL provisioned yet — the operator has not
      # created the secret. This step is the cheapest portable
      # alternative: every failure becomes an issue that surfaces on
      # the operator's next-morning sweep. Labels auto-apply so the
      # next morning can be sorted by category.
      #
      # Why github-script and not gh CLI + run-shell:
      # - one less step to debug at the operator-debug-time when the
      #   step itself errors.
      # - ${{ secrets.GITHUB_TOKEN }} already authenticated; gh CLI
      #   would need explicit login dance.
      # Failure modes the script handles explicitly:
      # - duplicate-issue guard via `gh issue list --label
      #   flaky-or-broken/e2e --state open` style check (skip the
      #   duplicate creation if a same-head-SHA issue is already open).
      # - script's own exception is logged but does NOT re-fail the
      #   job (failure is already signaled by the test step).
      - name: Auto-open GitHub issue on failure (operator triage)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const shortSha = context.sha.substring(0, 7);
            const runId = context.runId;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const trigger = context.eventName; // 'push', 'pull_request', 'schedule', or 'workflow_dispatch'
            const title = `e2e flake OR regression detected on ${context.workflow} @ ${shortSha} (${trigger})`;

            // duplicate-issue guard — pull any existing open issue with
            // the same SHA in the title. Skip the create if one exists
            // so we don't spam the operator's queue across re-runs of
            // the same commit (the retry-on-failure pattern is normal).
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'flaky-or-broken/e2e',
              per_page: 20,
            });
            const dupGuardRe = new RegExp(shortSha);
            const alreadyOpen = (existing.data || []).some(i => dupGuardRe.test(i.title || ''));
            if (alreadyOpen) {
              core.info(`An open issue for SHA ${shortSha} already exists; skipping duplicate-create (runId=${runId}).`);
              return;
            }

            const triageBlock = [
              '## Triage playbook',
              '',
              '1. **Open the run link above** and jump to the step that failed (`make test-e2e`).',
              '2. **Identify failure mode** by the log substring:',
              '   - `connection reset by peer` / `testcontainers` / `unable to start` / `context deadline exceeded` → **infra flake**',
              '     → close the issue with the `infra-flake` label and link the run URL in the closing comment.',
              '   - `missing column|relation` / `applyE2ESchema` / `tables not found` → **schema drift**',
              '     → fix in `tests/e2e/e2e_harness.go::applyE2ESchema` (sync with the prod migration).',
              '   - `MustNewRouter:` / `CredentialVault is required` / `one of WithXxx is missing` → **fixture drift**',
              '     → fix in the relevant e2e test file or extend `internal/testutil/{vault,stores}/`.',
              '   - `panic:` / `nil pointer` / `interface conversion` → **real production regression**',
              '     → triage via `git log ${shortSha}^..HEAD -- pkg/api/ tests/e2e/` and file a regression.',
              '3. **For real regressions**: remove the `flaky-or-broken/e2e` label and add the regression-area label, then file a regular fix PR linking this issue.',
              '',
            ].join('\n');

            const body = [
              'The `integration-slow` workflow hit a non-clean `make test-e2e` run.',
              '',
              `- **Workflow**: \`${context.workflow}\``,
              `- **Trigger**: \`${trigger}\``,
              `- **SHA**: \`${context.sha}\` (${shortSha})`,
              `- **Ref**: \`${context.ref}\``,
              `- **Run**: ${runUrl}`,
              `- **Deploy status**: this lane is **NOT** the deploy gate — \`integration-fast\` ran in parallel and the bundle deploys regardless of this lane\\'s status.`,
              '',
              triageBlock,
              `Auto-opened by \`${context.workflow}\`@${runId} (slow lane)",
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['flaky-or-broken/e2e', 'auto-flagged'],
            });
            core.info(`Opened issue for SHA ${shortSha} (runId=${runId}).`);

      # ─── Operator-friendly failure summary (unchanged from legacy) ─
      - name: Dump E2E summary on failure
        if: failure()
        run: |
          echo "=== Likely causes ==="
          echo "  - Docker not available on runner (ubuntu-latest ships it pre-installed)"
          echo "  - Postgres container start race (240 s ceiling in tests/e2e/e2e_harness.go post-WaitReady commit 045bc43)"
          echo "  - pgx/v5 stdlib driver missing — verify github.com/jackc/pgx/v5 is in go.mod"
          echo "  - A scenario subtest logged a diff at the failing t.Logf line — read upwards"
          echo "  - Apparent MinIO gap is intentional: storage_test.go covers S3;"
          echo "    Task 9.10 followup plans a MinIO testcontainer + aws-sdk-v2"
          echo
          echo "Run locally: make test-e2e"
          echo "Run with -tags=e2e only (no need for `make`): go test -tags=e2e -timeout 15m ./tests/e2e/..."
