# .github/workflows/deploy.yml — InstaEditLogin Vercel deploy
#
# Independent from .github/workflows/integration-fast.yml (which is
# CI-only — gofmt / vet / race-test / vitest / vite build / oauth-
# canary unit tests / envfile-parser regression) and is responsible
# for shipping the web bundle to Vercel production. The slow-lane
# coverage (e2e via testcontainers-go) lives in
# .github/workflows/integration-slow.yml and is alert-only — it
# does NOT block this deploy on failure.
#
# Why a dedicated deploy workflow instead of relying on the
# Vercel-for-Git integration:
# Vercel's git-app sometimes silently stops triggering deploys on push
# (we observed this in production — multiple pushes arrived on `main`,
# `git log` showed them, but Vercel's edge cache never invalidated).
# Running `npx vercel deploy --prod` from a workflow runner we control
# makes the deploy loop durable: the next green CI run WILL produce a
# deploy, the build artifact WILL be re-uploaded, the CDN WILL refresh.
#
# Why the deploy is gated on the integration-fast workflow:
# The previous model deployed on every push to `main` without waiting
# for CI. That required perfect branch-protection discipline to avoid
# shipping unverified code. Gating on the green `integration-fast`
# workflow enforces the "CI passes before deploy" contract
# automatically and reduces the blast radius of a bad push. The slow
# e2e lane (integration-slow) is deliberately NOT in the gate — its
# failure pattern is infrastructure-flake-on-ephemeral-postgres, which
# would mask product regressions with infra noise if it held bundles.
#
# Why prebuilt (no re-build in this job):
# The old flow ran `npm ci` + `tsc`/`vite build` a SECOND time inside
# this job via amondnet/vercel-action (~1-2 min wasted per deploy and a
# second chance for the bundle to differ from what CI validated).
# integration-fast now uploads `web/dist` as the `web-dist` artifact;
# this job downloads it and runs `vercel deploy --prebuilt`, which
# uploads the Build Output API v3 layout in `.vercel/output/` as-is.
# Because `--prebuilt` bypasses vercel.json routing, the host-based
# apex redirects AND the SPA catch-all rewrite are replicated in
# `.vercel/output/config.json` (Build Output API v3 semantics).
#
# Trigger model:
#   - This workflow runs when the `integration-fast` workflow completes.
#   - The deploy job only starts if `integration-fast` concluded with success.
#   - `workflow_dispatch` remains available as a manual override; in that
#     lane the artifact is pulled from the most recent successful
#     integration-fast run on `main`.
#
# SAFETY: if you ever need to bypass the CI gate (true emergency),
# use `workflow_dispatch` after documented approval, not a silent push.
#
# Why NOT Vercel-for-Git: the Git-app installation sometimes silently
# stops triggering deploys on push (observed in production — git log
# showed push landed, Vercel CDN never refreshed). Running `npx vercel
# deploy --prod` from a workflow runner we control makes the loop
# durable.
#
# Required GitHub repo secrets (Settings → Secrets and variables →
# Actions → New repository secret). FAIL-FAST if any is missing:
#   VERCEL_TOKEN     vercel.com/account/tokens → Create Token (Full Account)
#   VERCEL_ORG_ID    /v2/teams → id of team owning the project (or /v2/user for personal account)
#   VERCEL_PROJECT_ID /v9/projects → id of the InstaEdit project
#
# ⚠️ DEPLOY-DUPLICATION NOTE:
# If the Vercel-for-Git integration is STILL partially active in
# vercel.com/dashboard (Settings → Git → Connected Git Repository),
# it may ALSO deploy on every push. That would create a duplicate
# deploy per commit. Mitigation: disconnect the GitHub repo from the
# Vercel dashboard once this workflow is verified to work — both paths
# point at the same Vercel project so duplicates are safe but wasteful.

name: deploy

# Minimum-needed scopes.
#   - contents: read     → checkout repo + read root vercel.json
#   - actions: read      → workflow_run trigger needs to read sibling
#                          workflow conclusions to gate on success
#                          (without it some runners say: "GitHub Actions
#                          is not permitted to access actions in this
#                          repository") AND to download the `web-dist`
#                          artifact uploaded by integration-fast.
permissions:
  contents: read
  actions: read

# NOTE: GitHub Actions YAML 1.2 treats `on` as a normal string, but
# some YAML tools (yaml.safe_load in Python ≤1.1 mode, older NSIS
# parsers) interpret `on` as boolean true. Quoting the key keeps the
# file portable across both. (Existing integration-fast.yml + integration-slow.yml use
# the same convention — keep them aligned.)
"on":
  # Run only after the `integration-fast` workflow completes. The
  # job-level `if` below enforces that the triggering run was
  # successful on the `main` branch. This prevents unverified code
  # from reaching production. The slow e2e lane (integration-slow)
  # runs in parallel and alerts via GH-issue on failure without
  # blocking this deploy.
  workflow_run:
    workflows: [integration-fast]
    types: [completed]
    branches: [main]
  # Manual override. Useful when Vercel edge cache serves stale assets
  # and we need to re-deploy the last commit without waiting for a
  # full integration run (use sparingly and with documented approval).
  workflow_dispatch:

# Cancel in-progress deploys so a fast follow-up push OR a manual
# workflow_dispatch override doesn't spawn duplicate runners
# re-uploading the same artifacts to Vercel. Group by `github.ref`
# (NOT the older `head_branch || github.ref`) so BOTH trigger lanes
# — workflow_run (CI-spawned) and workflow_dispatch (manual override)
# — share ONE concurrency group and cancel each other. The older
# expression produced different group keys per trigger
# (`deploy-main` vs `deploy-refs/heads/main`) and therefore never
# cancelled across lanes; the documented intent of
# `cancel-in-progress` is "deduplicate Vercel uploads", not
# "preserve manual-override progress", so unifying to `github.ref`
# is the correct semantic. PR #X deploys still don't cancel main
# deploys because their `github.ref` differs.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    name: Deploy web/app to Vercel (production, prebuilt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only deploy when the integration-fast workflow succeeded on main,
    # or when a repository admin explicitly triggers a manual deploy.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────
      # `ref:` pins the checkout to the EXACT commit this run was
      # spawned for. Without it:
      #   - on workflow_run (the production path) the runner checks
      #     out the current `main` HEAD, which can have drifted from
      #     the head_sha that triggered this run if a fast-followup
      #     push landed during integration. The deploy would then
      #     publish a DIFFERENT commit than the green-CI one.
      #   - on workflow_dispatch (manual override) `github.sha` is
      #     the SHA of the workflow_dispatch event itself, which is
      #     still a stable, deterministic per-run anchor.
      # Source: scripts/push-deploy-verify.sh (CLI deploy verifier)
      # calls out exactly this race for the operator.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ─── 1.5. Node toolchain for the Vercel CLI ─────────────────
      # The old amondnet/vercel-action provisioned its own Node; now
      # that we invoke `npx vercel` directly we pin Node 20 explicitly
      # (Vercel CLI 57 requires >= 18; 20 matches integration-fast).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ─── 1.6. Resolve the CI run that produced the bundle ────────
      # workflow_run → the run that triggered us; workflow_dispatch →
      # the most recent integration-fast run on main (the bundle it
      # uploaded is the freshest green artifact available).
      - name: Resolve CI run id for artifact download
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            # Manual override: pick the most recent integration-fast run
            # that COMPLETED with success on main (its web-dist artifact
            # is guaranteed to exist). Avoids grabbing a still-running or
            # failed run whose artifact was never uploaded.
            RUN_ID="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow integration-fast.yml \
              --branch main \
              --status completed \
              --limit 20 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success")][0].databaseId')"
            if [ -z "${RUN_ID}" ]; then
              echo "::error::Nessun run integration-fast completato con successo su main: impossibile scaricare l'artefatto web-dist."
              exit 1
            fi
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      # ─── 2. Download the bundle built & validated by CI ──────────
      # integration-fast uploads `web/dist` as the `web-dist` artifact
      # (see integration-fast.yml step 8.5). This is the SAME bundle
      # that passed vitest + tsc + vite build — no re-build here.
      - name: Download frontend bundle (web-dist)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: /tmp/web-dist
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ─── 3. Deploy (prebuilt — no npm ci, no tsc/vite) ───────────
      # Assembles the Build Output API v3 layout that `vercel deploy
      # --prebuilt` uploads verbatim:
      #   .vercel/project.json  → project + org linkage
      #   .vercel/output/static → the built web/dist files
      #   .vercel/output/config.json → routing rules. NOTE: with
      #   --prebuilt, vercel.json's redirects/rewrites are NOT applied,
      #   so the apex host redirects (instaedit.org / www.instaedit.org
      #   → app.instaedit.org) AND the SPA catch-all rewrite to
      #   /index.html are replicated here explicitly.
      #
      # `--meta githubCommitSha=...` keeps scripts/push-deploy-verify.sh
      # able to locate this deployment by commit SHA.
      - name: Deploy web/app to Vercel (production, prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          # Build Output API v3 layout
          mkdir -p .vercel/output/static
          if [ -d /tmp/web-dist/dist ]; then
            cp -r /tmp/web-dist/dist/. .vercel/output/static/
          else
            cp -r /tmp/web-dist/. .vercel/output/static/
          fi

          # Project linkage (matches the secrets the old action used)
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

          # Routing: apex redirects + SPA rewrite (quoted heredoc keeps
          # $1 literal inside the JSON). A stale index.html (browser tab
          # opened before a deploy) may reference hashed chunks that no
          # longer exist: serving the SPA fallback for /assets/* would hand
          # HTML to the module loader, so return 404 instead and let the
          # app's chunk-load recovery (lib/chunkLoadRecovery.ts) reload.
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "has": [{ "type": "host", "value": "instaedit.org" }],
                "src": "/(.*)",
                "dest": "https://app.instaedit.org/$1",
                "status": 308
              },
              {
                "has": [{ "type": "host", "value": "www.instaedit.org" }],
                "src": "/(.*)",
                "dest": "https://app.instaedit.org/$1",
                "status": 308
              },
              { "handle": "filesystem" },
              { "src": "/api/(.*)", "dest": "https://api.instaedit.org/api/$1" },
              { "src": "/assets/(.*)", "status": 404 },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          JSON

          # Deploy the prebuilt output — no install, no build.
          npx --yes vercel@57.0.0 deploy --prebuilt --prod --yes \
            --token "$VERCEL_TOKEN" \
            --meta "githubCommitSha=${{ github.event.workflow_run.head_sha || github.sha }}"
