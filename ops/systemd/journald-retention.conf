# Journald retention limits — InstaEditLogin VPS.
#
# Without these, journald defaults to ~10% of the filesystem, which on a
# long-lived VPS grows into gigabytes of logs. These caps keep the journal
# bounded: 500 MB hard ceiling, 2 GB free disk kept aside, 14 days of
# retention, compressed. Applies after:
#   systemctl restart systemd-journald
# (and frees space immediately with: journalctl --vacuum-size=500M)
[Journal]
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=14d
Compress=yes
