# InstaEditLogin — production hardening overlay for the self-hosted stack.
#
# The base compose file defines the service graph and health-gated migration
# order. This overlay removes direct host exposure from infrastructure and
# binds the API only to loopback so public traffic must pass through Caddy.

services:
  db:
    ports: []

  # The base stack already binds API to 127.0.0.1 only. The worker has
  # no host ports. MinIO is published on loopback :19000 so Caddy can
  # serve the public media paths (/instaedit-media/* and
  # /instaedit-local/* — see ops/vps/Caddyfile); without this the
  # presigned cover/media URLs return 502.
  minio:
    ports:
      - "127.0.0.1:19000:9000"

# Pin the data volumes to the canonical project-scoped names (mirrors the
# base docker-compose.yml). If this overlay is ever loaded with a different
# COMPOSE_PROJECT_NAME the pinned names still resolve to the real volumes,
# so a deploy can never create an empty orphan volume that shadows the data.
volumes:
  instaedit_pg_data:
    name: instaeditlogin_instaedit_pg_data
  instaedit_minio_data:
    name: instaeditlogin_instaedit_minio_data
