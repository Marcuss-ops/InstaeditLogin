version: 1
language: en
purpose: >-
  Editorial title ideas for Codex video creation. Treat every item as a writing
  pattern, not as a factual claim. Replace placeholders only with details
  supported by the source material supplied for that specific video.

usage_rules:
  - Never invent arrests, charges, verdicts, sentences, deaths, injuries, confessions, leaks, or evidence.
  - Do not present allegations as established facts; attribute them to a named, supplied source and preserve uncertainty.
  - Do not imply that footage, audio, messages, or documents are leaked or unseen unless the supplied source establishes that.
  - If a pattern cannot be used accurately with the available source material, skip it and write a factual title.
  - Keep placeholders such as X and Y until the source material identifies the people involved.

placeholder_guide:
  X: primary person, team, or institution identified in the supplied source
  Y: another person, team, or institution identified in the supplied source
  EVENT: verified event or topic
  SOURCE: supplied source or publication
  DETAIL: specific, verified detail from the source

channel_rules:
  livestreaming:
    markets:
      United_States:
        max_livestreams_per_channel: 3
        max_duration: "11h55m"
      other_markets:
        enabled: false
    note: Schedule no more than three livestreams for each US channel; each stream must be shorter than 12 hours.

global_pool:
  - "What happened when X addressed EVENT?"
  - "X responds to the latest developments in EVENT"
  - "The key details from X's statement about EVENT"

